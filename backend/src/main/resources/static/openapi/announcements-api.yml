openapi: 3.0.3
info:
  title: AkademikApp
  description: API for commucation board
  version: 1.0.0

servers:
  - url: http://localhost:8085
    description: local server (Development)

tags:
  - name: Announcements
    description: managing announcements
  - name: Comments
    description: comments and discussions under posts
  - name: Reactions
    description: reactions

paths:
  /api/v1/announcements:
    get:
      tags:
        - Announcements
      summary: get announcements list
      operationId: getAnnouncements
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AnnouncementCategory'
        - name: floor
          in: query
          required: false
          schema:
            type: integer
            example: 3
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AnnouncementStatus'
            default: ACTIVE
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: recived everything ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnnouncementResponse'
    post:
      tags:
        - Announcements
      summary: add new announcement
      operationId: createAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnnouncementRequest'
      responses:
        '201':
          description: announcement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementResponse'
        '400':
          description: error with data validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/announcements/{id}:
    get:
      tags:
        - Announcements
      summary: get details of the specific announcement
      operationId: getAnnouncementById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: announcement found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementResponse'
        '404':
          description: announcement with this id doesnt exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Announcements
      summary: update announcement
      operationId: updateAnnouncement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnnouncementRequest'
      responses:
        '200':
          description: announcement updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementResponse'
        '400':
          description: invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: announcement doesnt exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Announcements
      summary: delete announcement
      operationId: deleteAnnouncement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: announcement deleted
        '404':
          description: announcement doesnt exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/announcements/{id}/comments:
    get:
      tags:
        - Comments
      summary: get specifi announcement's comments
      operationId: getAnnouncementComments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: list recived
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentResponse'
        '404':
          description: announcement doesnt exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Comments
      summary: add comment
      operationId: addCommentToAnnouncement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: comment added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '400':
          description: invalid comment content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: announcement doesnt exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/announcements/{id}/comments/{commentId}:
    delete:
      tags:
        - Comments
      summary: delete comment
      operationId: deleteComment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: comment deleted
        '404':
          description: comment or announcement doesnt exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/announcements/{id}/reactions:
    post:
      tags:
        - Reactions
      summary: add reaction
      operationId: addReaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionRequest'
      responses:
        '200':
          description: reaction added
        '400':
          description: invalid reaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: announcemetn doesnt exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/announcements/{id}/reactions/{reactionType}:
    delete:
      tags:
        - Reactions
      summary: delete reaction
      operationId: removeReaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: reactionType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ReactionType'
      responses:
        '204':
          description: reaction removed
        '404':
          description: announcement or reaction doesnt exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    AnnouncementCategory:
      type: string
      enum:
        - OFFICIAL
        - COUNCIL
        - SPONTANEOUS
        - GENERAL
      example: SPONTANEOUS

    AnnouncementPriority:
      type: string
      enum:
        - NORMAL
        - IMPORTANT
        - URGENT
      example: NORMAL

    AnnouncementStatus:
      type: string
      enum:
        - ACTIVE
        - CLOSED
        - ARCHIVED
      example: ACTIVE

    CreateAnnouncementRequest:
      type: object
      required:
        - title
        - content
        - category
      properties:
        title:
          type: string
          example: "Zamawiamy pizzę na 3. piętro!"
        content:
          type: string
          example: "Ktoś się dorzuca, żeby mieć darmową dostawę? Zamawiamy z Da Grasso za 20 minut."
        category:
          $ref: '#/components/schemas/AnnouncementCategory'
        priority:
          $ref: '#/components/schemas/AnnouncementPriority'
          default: NORMAL
        targetFloor:
          type: integer
          description: announcement only for specific floor
          example: 3
        expiresAt:
          type: string
          format: date-time
          example: "2026-10-21T21:00:00Z"
        imageUrl:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/poster.jpg"

    AnnouncementResponse:
      type: object
      required:
        - id
        - authorId
        - authorDisplayName
        - title
        - content
        - category
        - priority
        - status
        - isPinned
        - commentsCount
        - reactionsCount
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        authorId:
          type: integer
          format: int64
          example: 42
        authorDisplayName:
          type: string
          description: "name  + [room number]"
          example: "Tomek [312]"
        title:
          type: string
          example: "Zamawiamy pizzę na 3. piętro!"
        content:
          type: string
          example: "Ktoś się dorzuca, żeby mieć darmową dostawę? Zamawiamy z Da Grasso za 20 minut."
        category:
          $ref: '#/components/schemas/AnnouncementCategory'
        priority:
          $ref: '#/components/schemas/AnnouncementPriority'
        status:
          $ref: '#/components/schemas/AnnouncementStatus'
        isPinned:
          type: boolean
          example: false
        pinnedUntil:
          type: string
          format: date-time
          nullable: true
          example: null
        targetFloor:
          type: integer
          nullable: true
          example: 3
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-21T21:00:00Z"
        imageUrl:
          type: string
          format: uri
          nullable: true
          example: null
        commentsCount:
          type: integer
          example: 4
        reactionsCount:
          type: integer
          example: 2
        createdAt:
          type: string
          format: date-time
          example: "2026-10-21T18:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-21T18:30:00Z"

    UpdateAnnouncementRequest:
      type: object
      properties:
        title:
          type: string
          example: "Zamawiamy pizzę na 3. piętro! (ZMIANA GODZINY)"
        content:
          type: string
          example: "Czekamy do 21:15, bo Bartek jeszcze wraca z wydziału."
        category:
          $ref: '#/components/schemas/AnnouncementCategory'
        priority:
          $ref: '#/components/schemas/AnnouncementPriority'
        targetFloor:
          type: integer
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        imageUrl:
          type: string
          format: uri
          nullable: true

    CreateCommentRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          example: "Ja też chcę margeritę! Pokój 312."

    CommentResponse:
      type: object
      required:
        - id
        - announcementId
        - authorId
        - authorDisplayName
        - content
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 10
        announcementId:
          type: integer
          format: int64
          example: 1
        authorId:
          type: integer
          format: int64
          example: 15
        authorDisplayName:
          type: string
          example: "Kasia [204]"
        content:
          type: string
          example: "Ja też chcę margeritę! Pokój 312."
        createdAt:
          type: string
          format: date-time
          example: "2026-10-21T18:45:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-21T18:45:00Z"

    ReactionType:
      type: string
      enum:
        - LIKE
        - JOIN
        - HELPFUL
      example: JOIN

    ReactionRequest:
      type: object
      required:
        - reactionType
      properties:
        reactionType:
          $ref: '#/components/schemas/ReactionType'

    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - message
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-10-21T19:00:00Z"
        status:
          type: integer
          description: HTTP status code
          example: 404
        error:
          type: string
          description: HTTP error name
          example: "Not Found"
        message:
          type: string
          example: "Ogłoszenie o podanym ID nie istnieje"
        path:
          type: string
          example: "/api/v1/announcements/999"